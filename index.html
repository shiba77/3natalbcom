<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#eee;font-family:system-ui,sans-serif;padding:20px;max-width:640px;margin:0 auto}
.brand{text-align:center;margin:16px 0}
.brand img{max-width:120px;margin:0 auto 10px;display:block}
.brand h1{font-size:34px;color:#ffc94d;letter-spacing:-0.5px}
.tagline{font-size:15px;color:#ddd;margin-top:6px;font-weight:700}
.tagline .live-red{color:#ff4444}

.freeform input{flex:1;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#eee;font-size:14px}
.card{background:#1b1b1b;border:1px solid #333;border-radius:10px;padding:14px;margin-bottom:10px}
.card h2{font-size:16px;margin-bottom:10px;color:#ffc94d}
label{display:block;font-size:13px;color:#aaa;margin:8px 0 4px}
select,input{width:100%;padding:10px;border-radius:8px;border:1px solid #444;background:#222;color:#eee;font-size:15px}
.search-wrapper{position:relative;transition:opacity 0.2s}
.search-wrapper.dimmed{opacity:0.4}
.search-wrapper.dimmed:hover{opacity:0.7}
.suggestions{position:absolute;top:100%;right:0;left:0;background:#222;border:1px solid #444;border-radius:8px;max-height:200px;overflow-y:auto;z-index:10;display:none}

.suggestion:hover{background:#333}

.or-divider{text-align:center;margin:12px 0;position:relative}

.facet-row.dimmed:hover{opacity:0.7}
.facet-row > div{flex:1 1 130px;min-width:0}
.facet-label{font-size:11px;color:#888;margin-bottom:4px}

.row{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:8px 0;border-bottom:1px solid #2a2a2a;flex-wrap:wrap;gap:8px}

  100% { opacity: 1; }

@keyframes textSwapReverse {
  0%, 45% { opacity: 0; }
  50%, 95% { opacity: 1; }
  100% { opacity: 0; }
}
.market-pill.ready {

  font-weight: 700;
  position: relative;
  min-width: 140px;
}
.market-pill.ready:hover { transform: none; }
.ready-text {
  position: absolute;

  display: flex;
  align-items: center;
  justify-content: center;

}
.ready-text-a { animation: textSwap 3s ease-in-out infinite; }
.ready-text-b { animation: textSwapReverse 3s ease-in-out infinite; }

<script>

} catch(e) { db = null; }

var THRESHOLD = 25;
var condLabel = {new:'جديد', used:'مستعمل', any:'غير محدد'};
var allCategories = [];
var currentCategoryId = null;
var lastCounts = {};
var huntSelectedModelId = null;
var priceSelectedModelId = null;
var currentPriceId = null;
var loadCounter = 0;
var commentCounts = {};
var feedRows = {};
var FALLBACK_CATS = [
{id:1, name:'كروت الشاشة', is_active:true},
{id:2, name:'رامات', is_active:false},
{id:3, name:'SSD', is_active:false}
];

// Used only when the categories table has no facet_schema column yet.
var DEFAULT_GPU_SCHEMA = [
  {key:'manufacturer', label:'المصنّع', type:'select', match:'exact'},
  {key:'vram_gb', label:'الذاكرة', type:'number', unit:'GB', match:'min'}
];

// ============ OWNERSHIP HELPERS ============
function myPosts() {
  try {
    return JSON.parse(localStorage.getItem('my_posts') || '[]');
  } catch(e) { return []; }
}

function saveMyPost(type, id) {
  try {
    var posts = myPosts();
    posts.push({type: type, id: id});
    localStorage.setItem('my_posts', JSON.stringify(posts));
  } catch(e) {}
}

function isMyPost(type, id) {
  return myPosts().some(function(p) { return p.type == type && p.id == id; });
}

function myToken() {
  try {
    var t = localStorage.getItem('cm_token');
    if(!t) {
      t = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2,10);
      localStorage.setItem('cm_token', t);
    }
    return t;
  } catch(e) {
    return 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2,10);
  }
}

function toast(m, k) {
var el = document.getElementById('statusLine');
el.className = k || 'ok';
el.textContent = m;
el.style.display = 'block';
setTimeout(function() { el.style.display = 'none'; }, 4000);
}

function noDb() { return !db; }
function val(id) { return document.getElementById(id).value; }
function isAny(v) { return !v || v === 'غير محدد'; }

function timeAgo(dateStr) {
  if(!dateStr) return '';
  var now = new Date();
  var then = new Date(dateStr);
  var diff = Math.floor((now - then) / 1000);
  if(diff < 60) return 'الآن';
  var minutes = Math.floor(diff / 60);
  if(minutes < 60) return 'منذ ' + arabicTime(minutes, 'دقيقة', 'دقيقتين', 'دقائق');
  var hours = Math.floor(diff / 3600);
  if(hours < 24) return 'منذ ' + arabicTime(hours, 'ساعة', 'ساعتين', 'ساعات');
  var days = Math.floor(diff / 86400);
  if(days < 7) return 'منذ ' + arabicTime(days, 'يوم', 'يومين', 'أيام');
  var weeks = Math.floor(diff / 604800);
  if(weeks < 4) return 'منذ ' + arabicTime(weeks, 'أسبوع', 'أسبوعين', 'أسابيع');
  var months = Math.floor(diff / 2592000);
  return 'منذ ' + arabicTime(months, 'شهر', 'شهرين', 'أشهر');
}

function arabicTime(n, singular, dual, plural) {
  if(n === 1) return singular;
  if(n === 2) return dual;
  if(n >= 3 && n <= 10) return n + ' ' + plural;
  return n + ' ' + singular;
}
  
function esc(s) {
return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
});
}

function normalizeCustomInput(s) {
var cleaned = String(s).trim().replace(/\s+/g, ' ').toUpperCase();
cleaned = cleaned.replace(/([A-Z]+)(\d+)/g, '$1 $2');
return cleaned;
}

function normalizeCustomName(s) {
return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
}

function uniq(l) {
var o = [];
(l||[]).forEach(function(v) { if(v && o.indexOf(v) < 0) o.push(v); });
return o;
}

// ============ FACETS / LABELS (schema-driven) ============
function currentCat() {
  return allCategories.find(function(c) { return c.id === currentCategoryId; }) || null;
}

function currentSchema() {
  var c = currentCat();
  if(c && Array.isArray(c.facet_schema) && c.facet_schema.length) return c.facet_schema;
  if(c && c.facet_schema === undefined) return DEFAULT_GPU_SCHEMA;
  return [];
}

// Reads a facet value from a model/hunt/price row. Prefers attributes,
// falls back to the legacy GPU columns so old rows still display.
function rowAttr(r, key) {
  if(!r) return null;
  if(r.attributes && r.attributes[key] != null) return r.attributes[key];
  if(key === 'manufacturer') return r.manufacturer;
  if(key === 'vram_gb') return r.vram_gb != null ? r.vram_gb : r.min_vram_gb;
  return null;
}

function facetOptions(f) {
  if(Array.isArray(f.options)) return f.options;
  var vals = uniq((window.models || []).map(function(m) { return rowAttr(m, f.key); }));
  if(f.type === 'number') vals.sort(function(a, b) { return a - b; });
  return vals;
}

function specParts(get, forHunt) {
  var parts = [];
  var mf = get('manufacturer');
  if(mf) parts.push(mf);
  currentSchema().forEach(function(f) {
    if(f.key === 'manufacturer') return;
    var v = get(f.key);
    if(v == null || v === '') return;
    parts.push(v + (f.unit || '') + ((forHunt && f.match === 'min') ? '+' : ''));
  });
  return parts;
}

function getModelById(id) {
return (window.models || []).find(function(m) { return m.id == id; }) || null;
}

function rawLabelOf(m) {
  if(!m) return 'عنصر';
  var parts = [];
  var mf = rowAttr(m, 'manufacturer');
  if(mf) parts.push(mf);
  parts.push(m.model);
  currentSchema().forEach(function(f) {
    if(f.key === 'manufacturer') return;
    var v = rowAttr(m, f.key);
    if(v != null && v !== '') parts.push(v + (f.unit || ''));
  });
  var vt = (m.attributes && m.attributes.vram_type) || m.vram_type;
  if(vt) parts.push(vt);
  return parts.join(' ');
}

function labelOf(m) { return esc(rawLabelOf(m)); }
function modelName(id) { return labelOf(getModelById(id)); }

function rawPriceLabel(r) {
  if(r.models) return rawLabelOf(r.models);
  if(r.custom_model_name) return r.custom_model_name;
  var p = specParts(function(k) { return rowAttr(r, k); }, false);
  return p.length ? p.join(' ') : 'عنصر';
}
function priceLabel(r) { return esc(rawPriceLabel(r)); }

function rawHuntLabel(h) {
  if(h.model_id) return rawLabelOf(getModelById(h.model_id));
  if(h.custom_model_name) return h.custom_model_name;
  var p = specParts(function(k) { return rowAttr(h, k); }, true);
  return p.length ? p.join(' ') : 'طلب';
}
function huntLabel(h) { return esc(rawHuntLabel(h)); }

function renderFacets(prefix) {
  var box = document.getElementById(prefix + 'Facets');
  var divider = document.getElementById(prefix + 'Divider');
  if(!box) return;
  var schema = currentSchema();
  var show = schema.length > 0;
  box.style.display = show ? '' : 'none';
  if(divider) divider.style.display = show ? '' : 'none';
  var forHunt = prefix === 'hunt';
  box.innerHTML = schema.map(function(f) {
    var opts = facetOptions(f);
    var label = esc(f.label) + (f.required ? ' *' : '');
    var ctl;
    if(opts.length) {
      ctl = '<select class="facet-ctl" data-facet="' + esc(f.key) + '"><option value="">غير محدد</option>' +
        opts.map(function(v) {
          var t = (f.type === 'number') ? (v + (f.unit || '') + ((forHunt && f.match === 'min') ? '+' : '')) : v;
          return '<option value="' + esc(v) + '">' + esc(t) + '</option>';
        }).join('') + '</select>';
    } else {
      ctl = '<input class="facet-ctl" data-facet="' + esc(f.key) + '" type="' + (f.type === 'number' ? 'number' : 'text') + '" placeholder="غير محدد">';
    }
    return '<div><div class="facet-label">' + label + '</div>' + ctl + '</div>';
  }).join('');
  box.classList.remove('dimmed');
}

function collectAttrs(prefix) {
  var out = {};
  var box = document.getElementById(prefix + 'Facets');
  if(!box) return out;
  box.querySelectorAll('.facet-ctl').forEach(function(el) {
    var v = (el.value || '').trim();
    if(v) out[el.dataset.facet] = v;
  });
  return out;
}

function missingRequired(attrs) {
  return currentSchema().filter(function(f) { return f.required && !attrs[f.key]; })
    .map(function(f) { return f.label; });
}

function resetForms() {
  huntSelectedModelId = null;
  priceSelectedModelId = null;
  ['hunt', 'price'].forEach(function(p) {
    document.getElementById(p + 'Search').value = '';
    document.getElementById(p + 'Suggestions').style.display = 'none';
    undimAll(p);
  });
}

// ============ COMMENT COUNTS ============
async function loadCommentCounts() {
  try {
    var {data} = await db.from('comment_counts').select('*');
    commentCounts = {};
    (data || []).forEach(function(c) {

}

}

// ============ SOFT-DIM MUTUAL EXCLUSION ============
function hasFacetSelected(facetsId) {
  var facetsContainer = document.getElementById(facetsId);
  if(!facetsContainer) return false;
  return Array.from(facetsContainer.querySelectorAll('select, input'))
    .some(function(s) { return s.value !== ''; });
}

function clearFacets(facetsId) {
  var facetsContainer = document.getElementById(facetsId);
  if(!facetsContainer) return;
  facetsContainer.querySelectorAll('select, input').forEach(function(s) { s.value = ''; });
}

function dimSearch(prefix) {
  document.getElementById(prefix + 'SearchWrapper').classList.add('dimmed');
  document.getElementById(prefix + 'Facets').classList.remove('dimmed');
}

function dimFacets(prefix) {
  document.getElementById(prefix + 'SearchWrapper').classList.remove('dimmed');
  document.getElementById(prefix + 'Facets').classList.add('dimmed');
}

function undimAll(prefix) {
  document.getElementById(prefix + 'SearchWrapper').classList.remove('dimmed');
  document.getElementById(prefix + 'Facets').classList.remove('dimmed');
}

function setupSearch(inputId, suggestionsId, setModelId, prefix) {
var input = document.getElementById(inputId);
var suggestions = document.getElementById(suggestionsId);

input.addEventListener('input', function() {
clearFacets(prefix + 'Facets');
undimAll(prefix);

var query = normalizeCustomInput(input.value);
if(!query || query.length < 2) {
suggestions.style.display = 'none';
return;
}
var matches = (window.models || []).filter(function(m) {
return normalizeCustomName(rawLabelOf(m)).indexOf(normalizeCustomName(query)) >= 0;
}).slice(0, 8);

if(matches.length) {
suggestions.innerHTML = matches.map(function(m) {
return '<div class="suggestion" data-id="' + m.id + '">' + labelOf(m) + '</div>';
}).join('');
suggestions.style.display = 'block';
suggestions.querySelectorAll('.suggestion').forEach(function(el) {
el.onclick = function() {
input.value = rawLabelOf(matches.find(function(x) { return x.id == el.dataset.id; }));
suggestions.style.display = 'none';
setModelId(el.dataset.id);
clearFacets(prefix + 'Facets');
dimFacets(prefix);
};
});
} else {
suggestions.innerHTML = '<div class="suggestion" style="color:#aaa;">مش موجود؟ استخدموا المواصفات العامة تحت</div>';
suggestions.style.display = 'block';
}
});

input.addEventListener('focus', function() {
  if(document.getElementById(prefix + 'SearchWrapper').classList.contains('dimmed')) {
    clearFacets(prefix + 'Facets');
    undimAll(prefix);
    setModelId(null);
  }
});

document.addEventListener('click', function(e) {
if(!suggestions.contains(e.target) && e.target !== input) {
suggestions.style.display = 'none';
}
});
}

// Delegated listeners: they keep working when the facet controls are re-rendered.
function bindFacetsChange(prefix, clearModelId) {
  var facetsContainer = document.getElementById(prefix + 'Facets');
  if(!facetsContainer) return;

  function onFacetChange() {
    if(hasFacetSelected(prefix + 'Facets')) {
      document.getElementById(prefix + 'Search').value = '';
      clearModelId(null);
      dimSearch(prefix);
    } else {
      undimAll(prefix);
    }
  }

  facetsContainer.addEventListener('change', onFacetChange);
  facetsContainer.addEventListener('input', function(e) {
    if(e.target.tagName === 'INPUT') onFacetChange();
  });

  facetsContainer.addEventListener('focusin', function() {
    if(facetsContainer.classList.contains('dimmed')) {
      document.getElementById(prefix + 'Search').value = '';
      clearModelId(null);
      undimAll(prefix);
    }
  });
}

setupSearch('huntSearch', 'huntSuggestions', function(id) { huntSelectedModelId = id; }, 'hunt');
setupSearch('priceSearch', 'priceSuggestions', function(id) { priceSelectedModelId = id; }, 'price');

bindFacetsChange('hunt', function(id) { huntSelectedModelId = id; });
bindFacetsChange('price', function(id) { priceSelectedModelId = id; });

async function toggleComments(type, id) {

  if(container.style.display !== 'none') {
    container.style.display = 'none';

  }

}

async function loadComments(type, id) {
  var container = document.getElementById('comments-' + type + '-' + id);
  if(!container) return;
  
  var {data, error} = await db.from('comments')
    .select('*')
    .eq('target_type', type)
    .eq('target_id', id)
    .order('created_at', {ascending: true})
    .limit(30);
  
  if(error) {
    container.innerHTML = '<div style="color:#ff6b6b;font-size:12px;">خطأ في تحميل التعليقات</div>';
    return;
  }
  
  var html = '';
  (data || []).forEach(function(c) {
    html += '<div style="padding:6px 0;border-bottom:1px solid #1a1a1a;font-size:13px;">' +
      '<b style="color:#ffc94d;">' + esc(c.nickname || 'عضو') + ':</b> ' +
      esc(c.body) + '</div>';
  });

    '<input id="comment-input-' + type + '-' + id + '" type="text" maxlength="200" placeholder="اكتب تعليق…" style="flex:1;padding:8px;font-size:13px;background:#222;border:1px solid #444;border-radius:6px;color:#eee;">' +
    '<button onclick="postComment(\'' + type + '\',' + id + ')" style="padding:8px 12px;background:#ffc94d;color:#111;border:none;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px;">ارسال</button>' +
    '</div>';
  
  container.innerHTML = html;
}

async function postComment(type, id) {
  var input = document.getElementById('comment-input-' + type + '-' + id);
  if(!input) return;
  var body = input.value.trim();
  if(!body) { toast('اكتب تعليق', 'err'); return; }
  if(body.length > 200) { toast('التعليق طويل كتير', 'err'); return; }
  
  var nickname = null;
  try { nickname = localStorage.getItem('3natalb_nickname') || null; } catch(e) {}
  
  var {error} = await db.from('comments').insert({
    target_type: type,
    target_id: id,
    user_token: myToken(),
    nickname: nickname,
    body: body
  });
  
  if(error) { toast('⚠️ ' + error.message, 'err'); return; }
  input.value = '';
  
  commentCounts[type + '_' + id] = (commentCounts[type + '_' + id] || 0) + 1;
  var counterBtn = document.getElementById('comment-btn-' + type + '-' + id);
  if(counterBtn) {
    counterBtn.innerHTML = '💬 ' + commentCounts[type + '_' + id];
  }
  
  await loadComments(type, id);
}

// ============ REPLY / SHARE ============
// Reply copies the request into the offer form: the model if it has one,
// otherwise the request's specs (so the offer can match a spec-only request).
function replyToHunt(huntId) {
  var r = feedRows['hunt_' + huntId];
  if(!r) return;
  var searchEl = document.getElementById('priceSearch');
  var cashEl = document.getElementById('cashPrice');
  var facetsBox = document.getElementById('priceFacets');
  var specOnly = false;

  if(r.target_price && r.target_price > 0) cashEl.value = r.target_price;
  clearFacets('priceFacets');

  if(r.model_id) {
    searchEl.value = rawLabelOf(getModelById(r.model_id));
    priceSelectedModelId = r.model_id;
    dimFacets('price');
  } else if(r.custom_model_name) {
    searchEl.value = r.custom_model_name;
    priceSelectedModelId = null;
    undimAll('price');
  } else {
    specOnly = true;
    searchEl.value = '';
    priceSelectedModelId = null;
    currentSchema().forEach(function(f) {
      var v = rowAttr(r, f.key);
      var el = facetsBox.querySelector('[data-facet="' + f.key + '"]');
      if(!el || v == null || v === '') return;
      if(el.tagName === 'SELECT' && !Array.prototype.some.call(el.options, function(o) { return o.value == v; })) {
        el.insertAdjacentHTML('beforeend', '<option value="' + esc(v) + '">' + esc(v + (f.unit || '')) + '</option>');
      }
      el.value = v;
    });
    if(hasFacetSelected('priceFacets')) dimSearch('price'); else undimAll('price');
  }

  (specOnly ? facetsBox : searchEl).scrollIntoView({behavior: 'smooth', block: 'center'});
  (specOnly ? cashEl : searchEl).focus();
  toast('📢 رد ع الطلب — سعّروا عرضكم', 'ok');
}

return 'https://wa.me/?text=' + encodeURIComponent(t);

async function getVoteCounts() {

if(noDb()) return c;
try {

(r.data || []).forEach(function(v) { c[v.category_id] = (c[v.category_id]||0) + 1; });

async function loadCategories() {
if(noDb()) {
allCategories = FALLBACK_CATS;
currentCategoryId = 1;
renderMarketStrip();
toast('⚠️ لا يوجد اتصال بقاعدة البيانات', 'err');
return;
}
try {
var r = await db.from('categories').select('id,name,slug,is_active,sort_order,facet_schema').order('sort_order');
if(r.error) {
  // facet_schema column not there yet: load without it (GPU defaults apply)
  r = await db.from('categories').select('id,name,slug,is_active,sort_order').order('sort_order');
}
if(r.error || !r.data || !r.data.length) {
allCategories = FALLBACK_CATS;
currentCategoryId = 1;
renderMarketStrip();
toast('⚠️ ما قدرنا نحمل الأسواق', 'err');
return;
}
allCategories = r.data;
var first = categoryFromHash() || allCategories.find(function(c){return c.is_active;}) || allCategories[0];
currentCategoryId = first.id;
lastCounts = await getVoteCounts();
renderMarketStrip();
loadModelsForCategory(currentCategoryId);
} catch(e) {
allCategories = FALLBACK_CATS;
currentCategoryId = 1;
renderMarketStrip();
toast('⚠️ خطأ في تحميل الأسواق', 'err');
}
}

function renderMarketStrip() {
var html = '';
allCategories.filter(function(c){return c.is_active;}).forEach(function(c) {
html += '<button class="market-pill'+(c.id===currentCategoryId?' active':'')+'" onclick="switchCategory('+c.id+')">'+esc(c.name)+' · مفتوح</button>';
});
allCategories.filter(function(c){return !c.is_active;}).sort(function(a,b){return (lastCounts[b.id]||0)-(lastCounts[a.id]||0);}).forEach(function(c) {
var cnt = lastCounts[c.id] || 0;
var reached = cnt >= THRESHOLD;
if(reached) {
  html += '<button class="market-pill ready" data-name="' + esc(c.name) + '">' +
    '<span class="ready-text ready-text-a">اكتمل التصويت</span>' +
    '<span class="ready-text ready-text-b">' + esc(c.name) + ' · قريباً</span>' +
    '</button>';
} else {
  html += '<button class="market-pill vote" onclick="voteForCategory('+c.id+')">'+esc(c.name)+' · '+cnt+'/'+THRESHOLD+' تصويت</button>';
}
});
html += '<div class="freeform"><input id="newMarketName" placeholder="سوق جديد؟ كتابة اسم السوق…"><button class="market-pill new-market" onclick="submitFreeformVote()">+ تصويت</button></div>';
document.getElementById('marketStrip').innerHTML = html;
}

// Opens only ACTIVE markets from #slug; unknown/closed slugs fall back to the default.
function categoryFromHash() {
  var slug = decodeURIComponent((location.hash || '').replace(/^#/, ''));
  if(!slug) return null;
  return allCategories.find(function(c) { return c.is_active && c.slug === slug; }) || null;
}

function setHash(id) {
  var c = allCategories.find(function(x) { return x.id === id; });
  if(!c || !c.slug) return;
  try { history.replaceState(null, '', location.pathname + location.search + '#' + c.slug); } catch(e) {}
}

window.addEventListener('hashchange', function() {
  var c = categoryFromHash();
  if(c && c.id !== currentCategoryId) switchCategory(c.id, true);
});

function switchCategory(id, fromHash) {
if(id === currentCategoryId && !fromHash) return;
currentCategoryId = id;
if(!fromHash) setHash(id);
resetForms();
renderMarketStrip();
loadModelsForCategory(id);
}

async function voteForCategory(id) {

var {data: existing} = await db.from('category_votes')

.eq('user_token', token)

return;
}
lastCounts = await getVoteCounts();
renderMarketStrip();
toast('✅ تم التصويت بنجاح', 'ok');

async function submitFreeformVote() {

document.getElementById('huntFeed').innerHTML = '<div class="row">لا يوجد طلبات, كن الأول</div>';
}
}

// ============ BOOSTS / REPORTS ============
async function boostHunt(huntId) {
  if(noDb()) { toast('⚠️ لا يوجد اتصال', 'err'); return; }
  var boostedKey = 'boosted_hunt_' + huntId;
  try {
    if(localStorage.getItem(boostedKey)) {
      toast('⚡ تم الدعم مسبقاً', 'ok');
      return;
    }
  } catch(e) {}
  try {
    var {error} = await db.rpc('boost_hunt', {p_hunt_id: huntId, p_token: myToken()});
    if(error) { toast('⚠️ في مشكلة بالدعم', 'err'); return; }
    try { localStorage.setItem(boostedKey, '1'); } catch(e) {}
    loadFeeds();
  } catch(e) { toast('⚠️ في مشكلة', 'err'); }
}

async function reportDead(priceId) {
if(!confirm('تأكيد أن هذا العرض منتهي الصلاحية/مباع؟')) return;

// ============ WHATSAPP / SHARE ============
function waLink(num, text) {
var d = (num || '').replace(/\D/g, '');
if(d.startsWith('0')) d = '962' + d.slice(1);
return 'https://wa.me/' + d + '?text=' + encodeURIComponent(text);
}

function shareLink() {
var t = 'طلبوا على عنّا طلبكم — شوفوا سوق ' + marketName() + ': ' + cleanUrl();
return 'https://wa.me/?text=' + encodeURIComponent(t);
}

// ============ CREATE PRICE ============
async function savePrice() {
if(noDb()) { toast('⚠️ لا يوجد اتصال', 'err'); return; }
var searchVal = val('priceSearch').trim();
var attrs = collectAttrs('price');

if(!searchVal && !priceSelectedModelId && !Object.keys(attrs).length) {
toast('ابحث عن موديل أو حدد مواصفات', 'err');
return;
}

if(!searchVal && !priceSelectedModelId) {
  var missing = missingRequired(attrs);
  if(missing.length) { toast('حددوا: ' + missing.join('، '), 'err'); return; }
}

var cash = +val('cashPrice');
if(!cash) { toast('إضافة سعر الكاش', 'err'); return; }


var sellerTok = 'S_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);

try {
var {data: priceId, error: insertErr} = await db.rpc('create_price', {
p_category_id: currentCategoryId,
p_model_id: priceSelectedModelId || null,
p_custom_model_name: (priceSelectedModelId || !searchVal) ? null : normalizeCustomInput(searchVal),
p_attributes: attrs,
p_condition: val('priceCond'),
p_cash_price: cash,
p_trade_price: +val('tradePrice') || null,
p_whatsapp: val('priceWa') || null,
p_seller_token: sellerTok,
p_user_token: myToken()
});
if(insertErr) { toast('⚠️ ' + insertErr.message, 'err'); return; }

saveMyPost('price', priceId);

var msg = '✅ عرضكم نزل.';
var {data: rpcMatch} = await db.rpc('match_price_to_hunts', {p_price_id: priceId});
if(rpcMatch && rpcMatch.length) {
  msg += ' <b>في ' + rpcMatch.length + ' طلب مطابق!</b>';
  var {data: contactData} = await db.rpc('reveal_hunt_contact', {
    p_hunt_id: rpcMatch[0].hunt_id,
    p_price_id: priceId
  });
  if(contactData && contactData.length && contactData[0].whatsapp) {
    var label = priceSelectedModelId ? rawLabelOf(getModelById(priceSelectedModelId))
      : (searchVal ? normalizeCustomInput(searchVal)
      : (specParts(function(k) { return attrs[k]; }, false).join(' ') || 'عنصر'));
    msg += ' <a class="btn green" href="' + waLink(contactData[0].whatsapp, 'مرحبا! عندي ' + label + ' بـ ' + cash + ' دينار. شفت طلبكم على عنّا طلبكم.') + '">💬 أبلغ الطالب</a>';
  }
}

var dashboardUrl = 'https://3natalb.com?seller=' + sellerTok;
var waMsg = 'رابط إدارة عرضكم على عنّا طلبكم:%0A' + dashboardUrl;
msg += ' <a class="btn green" href="https://wa.me/?text=' + encodeURIComponent(waMsg) + '">📩 احفظوا رابط إدارة العرض</a>';
msg += ' <a class="btn share" href="' + shareLink() + '">📤 شاركوا</a>';
msg += ' <button class="btn share" style="background:#4d1d1d;color:#ffa8a8;border-color:#6b2a2a;" onclick="cancelPrice(' + priceId + ')">❌ احذف العرض</button>';
document.getElementById('priceMsg').innerHTML = msg;
loadFeeds();
} catch(e) { toast('⚠️ في مشكلة تقنية', 'err'); }
}

// ============ CREATE HUNT ============
async function castHunt() {
if(noDb()) { toast('⚠️ لا يوجد اتصال', 'err'); return; }
var searchVal = val('huntSearch').trim();
var attrs = collectAttrs('hunt');

if(!searchVal && !huntSelectedModelId && !Object.keys(attrs).length) {
toast('ابحث عن موديل أو حدد مواصفات', 'err');
return;
}

if(!searchVal && !huntSelectedModelId) {
  var missing = missingRequired(attrs);
  if(missing.length) { toast('حددوا: ' + missing.join('، '), 'err'); return; }
}

var budget = +val('huntPrice');
if(!budget) { toast('إضافة أقصى ميزانية', 'err'); return; }

try {
var {data: huntId, error: insertErr} = await db.rpc('create_hunt', {
p_category_id: currentCategoryId,
p_model_id: huntSelectedModelId || null,
p_custom_model_name: (huntSelectedModelId || !searchVal) ? null : normalizeCustomInput(searchVal),
p_attributes: attrs,
p_target_price: budget,
p_condition: val('huntCond'),
p_whatsapp: val('huntWa') || null,
p_user_token: myToken()
});
if(insertErr) { toast('⚠️ ' + insertErr.message, 'err'); return; }

saveMyPost('hunt', huntId);

var code = 'CM-' + Math.floor(1000 + Math.random() * 9000);
var msg = '✅ طلبكم انعرض.';

var {data: rpcMatch} = await db.rpc('match_hunt_to_prices', {p_hunt_id: huntId});
if(rpcMatch && rpcMatch.length) {
var best = rpcMatch[0];
msg += ' <b>لقينا رد على طلبكم</b> ' + esc(best.model_name || best.custom_model_name || 'عرض') + ' بـ ' + esc(best.cash_price) + ' دينار.';
var {data: contactData} = await db.rpc('reveal_price_contact', {
  p_price_id: best.price_id,
  p_hunt_id: huntId
});
if(contactData && contactData.length && contactData[0].whatsapp) {
msg += ' <a class="btn green" href="' + waLink(contactData[0].whatsapp, 'مرحبا! شفت طلبكم على عنّا طلبكم (' + code + '). لسا موجود؟') + '">💬 تواصلوا مع البائع (' + code + ')</a>';
} else {
msg += ' لايوجد رقم للتواصل، تابعوا العروض من هنا.';
}
}
msg += ' <a class="btn share" href="' + shareLink() + '">📤 شارك</a>';
msg += ' <button class="btn share" style="background:#4d1d1d;color:#ffa8a8;border-color:#6b2a2a;" onclick="cancelHunt(' + huntId + ')">❌ احذف الطلب</button>';
document.getElementById('huntMsg').innerHTML = msg;
loadFeeds();
} catch(e) { toast('⚠️ في مشكلة تقنية', 'err'); }
}

// ============ INIT ============
function scrollToForm(type) {
  var id = type === 'price' ? 'priceFormCard' : 'huntFormCard';
  var el = document.getElementById(id);
  if(!el) return;
  el.scrollIntoView({behavior: 'smooth', block: 'start'});
  el.style.transition = 'box-shadow .3s';
  el.style.boxShadow = '0 0 0 2px #ffc94d';
  setTimeout(function() { el.style.boxShadow = 'none'; }, 1200);
}
  
loadCategories();
checkSellerDashboard();
</script>

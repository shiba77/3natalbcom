<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CastingMe Admin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#111;color:#eee;font-family:system-ui,sans-serif;padding:20px;max-width:640px;margin:0 auto}
.card{background:#1b1b1b;border:1px solid #333;border-radius:10px;padding:20px;margin:20px 0}
label{display:block;font-size:14px;color:#aaa;margin:12px 0 6px}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #444;background:#222;color:#eee;font-size:15px}
.btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:700;margin-top:16px;cursor:pointer}
.primary{background:#ffc94d;color:#111}
.danger{background:#8b0000;color:#fff}
.msg{margin-top:12px;padding:10px;border-radius:8px;font-size:14px}
.success{background:#1d4d2b;color:#7dffa8}
.error{background:#4d1d1d;color:#ffa8a8}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid #2a2a2a}
.delete-btn{background:#8b0000;color:#fff;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
h1{text-align:center;margin-bottom:20px}
h2{margin:24px 0 12px;color:#ffc94d}
</style>
</head>
<body>
<h1>🔐 لوحة تحكم CastingMe</h1>

<div id="loginSection" class="card">
<h2>تسجيل الدخول</h2>
<label>اسم المستخدم</label>
<input type="text" id="username" value="admin">
<label>كلمة المرور</label>
<input type="password" id="password" placeholder="admin1234">
<button class="btn primary" onclick="login()">دخول</button>
<div id="loginMsg" class="msg"></div>
</div>

<div id="adminSection" style="display:none">
<div class="card">
<h2>🔧 تغيير كلمة المرور</h2>
<label>كلمة المرور الحالية</label>
<input type="password" id="currentPass">
<label>كلمة المرور الجديدة</label>
<input type="password" id="newPass">
<label>تأكيد كلمة المرور الجديدة</label>
<input type="password" id="confirmPass">
<button class="btn primary" onclick="changePassword()">تحديث كلمة المرور</button>
<div id="passMsg" class="msg"></div>
</div>
<div class="card"><h2>🟢 الأسعار المنشورة</h2><div id="pricesList"></div></div>
<div class="card"><h2>🔥 الطلبات المفتوحة</h2><div id="huntsList"></div></div>
<button class="btn danger" onclick="logout()">تسجيل الخروج</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
window.addEventListener('error', function(e){
var el = document.getElementById('loginMsg');
if (el) { el.className='msg error'; el.textContent='❌ خطأ: '+e.message; }
});

var db = window.supabase.createClient('https://ktngduotvfaxnohvcasf.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt0bmdkdW90dmZheG5vaHZjYXNmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NzY5MTgsImV4cCI6MjEwMzA1MjkxOH0.w1f88i4Cux1FqReObhaZaEYwvLbLh6dPUQY0lrKrLRA');

async function sha256(message){
var buf = new TextEncoder().encode(message);
var hb = await crypto.subtle.digest('SHA-256', buf);
return Array.from(new Uint8Array(hb)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
}
function makeToken(){ return 'tok-'+Date.now()+'-'+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2); }

async function checkSession(){
var token = localStorage.getItem('adminToken');
if (!token) return false;
var r = await db.from('admin_sessions').select('*').eq('session_token', token).gt('expires_at', new Date().toISOString()).single();
return !!r.data;
}

async function login(){
var msgEl = document.getElementById('loginMsg');
try {
var username = document.getElementById('username').value;
var password = document.getElementById('password').value;
var hash = await sha256(password);
var r = await db.from('admin_users').select('*').eq('username', username).eq('password_hash', hash).single();
if (r.error || !r.data) {
msgEl.className='msg error';
msgEl.textContent='❌ اسم المستخدم أو كلمة المرور غير صحيحة';
return;
}
var admin = r.data;
var token = makeToken();
var expires = new Date(); expires.setHours(expires.getHours()+24);
await db.from('admin_sessions').insert({ admin_id: admin.id, session_token: token, expires_at: expires.toISOString() });
await db.from('admin_users').update({ last_login: new Date().toISOString() }).eq('id', admin.id);
localStorage.setItem('adminToken', token);
msgEl.className='msg success';
msgEl.textContent='✅ تم تسجيل الدخول بنجاح';
setTimeout(showAdmin, 800);
} catch(e) {
msgEl.className='msg error';
msgEl.textContent='❌ خطأ: '+e.message;
}
}

function showAdmin(){
document.getElementById('loginSection').style.display='none';
document.getElementById('adminSection').style.display='block';
loadAdminData();
}

async function logout(){
var token = localStorage.getItem('adminToken');
if (token) await db.from('admin_sessions').delete().eq('session_token', token);
localStorage.removeItem('adminToken');
location.reload();
}

async function changePassword(){
var msgEl = document.getElementById('passMsg');
var current = document.getElementById('currentPass').value;
var newPass = document.getElementById('newPass').value;
var confirm = document.getElementById('confirmPass').value;
if (newPass !== confirm) { msgEl.className='msg error'; msgEl.textContent='❌ كلمة المرور الجديدة غير متطابقة'; return; }
if (newPass.length < 6) { msgEl.className='msg error'; msgEl.textContent='❌ كلمة المرور يجب أن تكون 6 أحرف على الأقل'; return; }
var currentHash = await sha256(current);
var token = localStorage.getItem('adminToken');
var s = await db.from('admin_sessions').select('admin_id').eq('session_token', token).single();
if (s.error || !s.data) { msgEl.className='msg error'; msgEl.textContent='❌ الجلسة منتهية — سجل الدخول من جديد'; return; }
var a = await db.from('admin_users').select('*').eq('id', s.data.admin_id).eq('password_hash', currentHash).single();
if (!a.data) { msgEl.className='msg error'; msgEl.textContent='❌ كلمة المرور الحالية غير صحيحة'; return; }
var newHash = await sha256(newPass);
await db.from('admin_users').update({ password_hash: newHash }).eq('id', a.data.id);
msgEl.className='msg success';
msgEl.textContent='✅ تم تحديث كلمة المرور بنجاح';
document.getElementById('currentPass').value='';
document.getElementById('newPass').value='';
document.getElementById('confirmPass').value='';
}

async function loadAdminData(){
var condLabel = {new:'جديد', used:'مستعمل', any:'أي شي'};
var p = await db.from('prices').select(', gpu_models()').order('created_at',{ascending:false});
var h = await db.from('hunts').select(', gpu_models()').order('created_at',{ascending:false});
document.getElementById('pricesList').innerHTML = (p.data||[]).map(function(x){
var gpu = x.gpu_models ? (x.gpu_models.brand+' '+x.gpu_models.model+' '+(x.gpu_models.variant||'')) : 'كرت';
return '<div class="row"><span>'+gpu+' — '+x.cash_price+' دينار <span class="tag">'+(condLabel[x.condition]||x.condition)+'</span></span><button class="delete-btn" onclick="deletePrice('+x.id+')">حذف</button></div>';
}).join('') || '<div class="row">لا توجد أسعار</div>';
document.getElementById('huntsList').innerHTML = (h.data||[]).map(function(x){
var gpu = x.gpu_models ? (x.gpu_models.brand+' '+x.gpu_models.model+' '+(x.gpu_models.variant||'')) : 'كرت';
return '<div class="row"><span>'+gpu+' — لحد '+x.target_price+' دينار</span><button class="delete-btn" onclick="deleteHunt('+x.id+')">حذف</button></div>';
}).join('') || '<div class="row">لا توجد طلبات</div>';
}

async function deletePrice(id){
if (!confirm('هل أنت متأكد من حذف هذا السعر؟')) return;
await db.from('prices').delete().eq('id', id);
loadAdminData();
}
async function deleteHunt(id){
if (!confirm('هل أنت متأكد من حذف هذا الطلب؟')) return;
await db.from('hunts').delete().eq('id', id);
loadAdminData();
}

checkSession().then(function(ok){ if (ok) showAdmin(); });
</script>
</body>
</html>
